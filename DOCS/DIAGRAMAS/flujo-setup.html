<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Preparar una PC nueva para publicar</h1>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title flow-desc">
      <title id="flow-title">Flujo de preparación de una PC nueva</title>
      <desc id="flow-desc">Diagrama de flujo del setup: instalar prerequisitos, clonar o actualizar el repositorio según si ya existe, ejecutar el script de setup y quedar listo para publicar.</desc>
      <defs>
        <marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== FLECHAS ===== -->
      <!-- Inicio -> Prerequisitos -->
      <line x1="500" y1="96" x2="500" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Prerequisitos -> Decisión -->
      <line x1="500" y1="208" x2="500" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Decisión -> NO -> Clonar -->
      <line x1="392" y1="304" x2="324" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="344" y="286" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="358" y="295" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <!-- Decisión -> SÍ -> Actualizar -->
      <line x1="608" y1="304" x2="676" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <rect x="628" y="286" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="295" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SÍ</text>
      <!-- Clonar -> punto de fusión -->
      <path d="M 204,336 V 384 Q 204,392 212,392 H 492" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- Actualizar -> punto de fusión -->
      <path d="M 796,336 V 384 Q 796,392 788,392 H 508" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- Fusión -> Script -->
      <line x1="500" y1="396" x2="500" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
      <!-- Script -> Fin -->
      <line x1="500" y1="520" x2="500" y2="556" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#flow-arrow-accent)"/>

      <!-- ===== NODOS ===== -->
      <!-- Inicio -->
      <rect x="428" y="48" width="144" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inicio</text>

      <!-- Prerequisitos -->
      <rect x="304" y="136" width="392" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Instalar prerequisitos</text>
      <text x="500" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">winget: Git.Git · NodeJS.LTS · DockerDesktop</text>

      <!-- Decisión -->
      <polygon points="500,248 608,304 500,360 392,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Ya existe</text>
      <text x="500" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">el repo?</text>

      <!-- Clonar (rama NO) -->
      <rect x="88" y="272" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="204" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clonar con submódulos</text>
      <text x="204" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git clone --recurse-submodules</text>

      <!-- Actualizar (rama SÍ) -->
      <rect x="680" y="272" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="796" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actualizar</text>
      <text x="796" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git pull --ff-only</text>

      <!-- Punto de fusión -->
      <circle cx="500" cy="392" r="4" fill="#2d3142"/>

      <!-- Script (foco) -->
      <rect x="304" y="432" width="392" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="432" width="392" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ejecutar script de setup</text>
      <text x="500" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.\setup-publicacion.ps1 -RepoDir D:\Proyectos\ecommcerce-saas-sonet</text>

      <!-- Fin -->
      <rect x="372" y="560" width="256" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="589" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Listo para publicar</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="32" y1="616" x2="968" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
      <rect x="140" y="632" width="32" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="184" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INICIO / FIN</text>
      <rect x="316" y="632" width="32" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PASO</text>
      <polygon points="480,630 508,640 480,650 452,640" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DECISIÓN</text>
      <circle cx="608" cy="640" r="4" fill="#2d3142"/>
      <text x="624" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FUSIÓN</text>
      <rect x="720" y="632" width="32" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="764" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCO</text>
    </svg>
  </div>
</body>
</html>
