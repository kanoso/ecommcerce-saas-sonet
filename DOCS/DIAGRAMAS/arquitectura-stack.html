<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack de publicación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Stack de publicación — ecommcerce-saas-sonet</h1>

    <svg viewBox="0 0 1000 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
      <title id="arch-title">Stack de publicación tiendi</title>
      <desc id="arch-desc">Arquitectura del entorno de publicación: los frontends Angular llaman a la API NestJS, que usa PostgreSQL y Redis en Docker y exporta telemetría hacia Grafana.</desc>
      <defs>
        <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONAS (antes que flechas y nodos) ===== -->
      <rect x="32" y="120" width="392" height="328" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="124" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="133" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST · NODE 22</text>

      <rect x="520" y="120" width="448" height="328" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="540" y="124" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="133" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER DESKTOP</text>

      <!-- ===== FLECHAS ===== -->
      <!-- Frontends -> API -->
      <line x1="228" y1="232" x2="228" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <!-- API -> PostgreSQL -->
      <path d="M 384,341 H 440 Q 448,341 448,333 V 204 Q 448,196 456,196 H 552"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <!-- API -> Redis -->
      <path d="M 384,371 H 492 Q 500,371 500,363 V 340 Q 500,332 508,332 H 552"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>

      <!-- API -> Grafana (telemetría, punteado) -->
      <path d="M 152,400 V 456 Q 152,464 160,464 H 860 Q 868,464 868,456 V 312"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <rect x="456" y="444" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="453" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS · LOGS</text>

      <!-- ===== NODOS ===== -->
      <!-- Frontends Angular -->
      <rect x="72" y="152" width="312" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="152" width="312" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="158" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="96" y="167" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="228" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontends Angular</text>
      <text x="228" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">web · admin · vendor · go</text>

      <!-- tiendi-api (foco) -->
      <rect x="72" y="312" width="312" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="72" y="312" width="312" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="80" y="318" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="96" y="327" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="228" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tiendi-api</text>
      <text x="228" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NestJS · Prisma</text>

      <!-- PostgreSQL -->
      <rect x="552" y="152" width="184" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="552" y="152" width="184" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="560" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="574" y="167" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="644" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="644" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:5432 · db tiendi</text>

      <!-- Redis -->
      <rect x="552" y="288" width="184" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="552" y="288" width="184" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="560" y="294" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="582" y="303" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="644" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
      <text x="644" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:6379</text>

      <!-- Grafana -->
      <rect x="792" y="220" width="152" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="220" width="152" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="800" y="226" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="816" y="235" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
      <text x="868" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grafana</text>
      <text x="868" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prometheus · loki</text>

      <!-- ===== LEYENDA ===== -->
      <line x1="32" y1="488" x2="968" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>
      <line x1="140" y1="512" x2="168" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
      <text x="180" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LLAMADA SÍNCRONA</text>
      <line x1="372" y1="512" x2="400" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arch-arrow)"/>
      <text x="412" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">TELEMETRÍA</text>
      <rect x="548" y="504" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="572" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SERVICIO FOCAL</text>
    </svg>
  </div>
</body>
</html>
