<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reserva y pago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F5F9; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border-bottom: 1px solid #CBD5E1">
    <a href="Rifa.dc.html" aria-label="Volver" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #0F172A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Pagar boletos</span>
  </header>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFEDD5; border-bottom: 1px solid #FDBA74">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-size: 13px; font-weight: 600; color: #7C2D12">Tus números están reservados</span>
      <span style="font-size: 12px; color: #9A3412">Si no pagas a tiempo, vuelven a quedar libres.</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; color: #7C2D12">{{reloj}}</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px; overflow: hidden">
    <section style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; color: #475569">Smart TV 55" · sorteo 15 nov, 20:30</span>
      <div style="display: flex; gap: 8px">
        <span style="padding: 6px 12px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font: 700 15px 'JetBrains Mono', monospace">007</span>
        <span style="padding: 6px 12px; border-radius: 8px; background: #C2410C; color: #FFFFFF; font: 700 15px 'JetBrains Mono', monospace">023</span>
      </div>
      <div style="display: flex; justify-content: space-between; border-top: 1px solid #E2E8F0; padding-top: 10px">
        <span style="font-weight: 600">Total</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px">S/ 20.00</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700">Método de pago</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" onClick="{{elegirTarjeta}}" aria-pressed="{{esTarjeta}}" style="{{estiloTarjeta}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>
          Tarjeta
        </button>
        <button type="button" onClick="{{elegirYape}}" aria-pressed="{{esYape}}" style="{{estiloYape}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
          Yape
        </button>
      </div>
    </section>

    <sc-if value="{{esTarjeta}}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Número de tarjeta
          <input type="text" placeholder="0000 0000 0000 0000" style="height: 44px; border: 1px solid #94A3B8; border-radius: 10px; padding: 0 12px; font: 500 15px 'JetBrains Mono', monospace; background: #FFFFFF; color: #0F172A">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Vence
            <input type="text" placeholder="MM/AA" style="height: 44px; border: 1px solid #94A3B8; border-radius: 10px; padding: 0 12px; font: 500 15px 'JetBrains Mono', monospace; background: #FFFFFF; color: #0F172A">
          </label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">CVV
            <input type="text" placeholder="123" style="height: 44px; border: 1px solid #94A3B8; border-radius: 10px; padding: 0 12px; font: 500 15px 'JetBrains Mono', monospace; background: #FFFFFF; color: #0F172A">
          </label>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{esYape}}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 10px">
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Celular asociado a Yape
          <input type="tel" placeholder="9XX XXX XXX" style="height: 44px; border: 1px solid #94A3B8; border-radius: 10px; padding: 0 12px; font: 500 15px 'JetBrains Mono', monospace; background: #FFFFFF; color: #0F172A">
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Código de aprobación (desde tu app Yape)
          <input type="text" placeholder="000000" style="height: 44px; border: 1px solid #94A3B8; border-radius: 10px; padding: 0 12px; font: 500 15px 'JetBrains Mono', monospace; background: #FFFFFF; color: #0F172A">
        </label>
      </section>
    </sc-if>

    <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.4; color: #334155">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #C2410C">
      <span>Acepto los <a href="#">términos de la rifa</a> y la <a href="#">política de privacidad</a>.</span>
    </label>

    <p style="margin: 0; display: flex; gap: 8px; font-size: 12px; line-height: 1.45; color: #475569">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      Tus boletos se confirman cuando la pasarela valida el pago. Te llegan por correo.
    </p>
  </div>

  <footer style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #CBD5E1">
    <a href="EnVivo.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px">Pagar S/ 20.00</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { metodo: 'tarjeta', restante: 582 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState({ restante: Math.max(0, this.state.restante - 1) });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const base = 'display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; font: 600 15px Inter, sans-serif; cursor: pointer;';
    const activo = base + ' border: 2px solid #C2410C; background: #FFF7ED; color: #9A3412;';
    const inactivo = base + ' border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A;';
    const esTarjeta = this.state.metodo === 'tarjeta';
    const r = this.state.restante;
    const mm = String(Math.floor(r / 60)).padStart(2, '0');
    const ss = String(r % 60).padStart(2, '0');
    return {
      reloj: mm + ':' + ss,
      esTarjeta: esTarjeta,
      esYape: !esTarjeta,
      estiloTarjeta: esTarjeta ? activo : inactivo,
      estiloYape: esTarjeta ? inactivo : activo,
      elegirTarjeta: () => this.setState({ metodo: 'tarjeta' }),
      elegirYape: () => this.setState({ metodo: 'yape' })
    };
  }
}
</script>
</body>
</html>
