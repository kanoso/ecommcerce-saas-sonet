<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir números</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F5F9; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border-bottom: 1px solid #CBD5E1">
    <a href="Main.dc.html" aria-label="Volver" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: #0F172A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">Smart TV 55"</span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 0; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #475569">Precio</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px">S/ 10</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #475569">Cierre</span>
        <span style="font-weight: 600; font-size: 14px">15 nov, 20:00</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #475569">Sorteo</span>
        <span style="font-weight: 600; font-size: 14px">15 nov, 20:30</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; color: #475569; display: flex; align-items: center; gap: 6px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        Compromiso publicado · ronda drand #5 204 117
      </span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #0F172A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">sha256: 9f2c4e81a7d03b56c1e8f94a2d7b60e5…</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700">Elige tus números</h2>
      <div style="display: flex; gap: 4px">
        <button type="button" style="min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #0F172A; background: #0F172A; color: #FFFFFF; font: 600 12px Inter, sans-serif">001–042</button>
        <button type="button" style="min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: 600 12px Inter, sans-serif">043–084</button>
        <button type="button" aria-label="Más rangos" style="min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font: 600 12px Inter, sans-serif">…</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{celdas}}" as="c" hint-placeholder-count="42">
        <button type="button" onClick="{{c.pick}}" disabled="{{c.bloqueado}}" aria-label="{{c.etiqueta}}" aria-pressed="{{c.elegido}}" style="{{c.estilo}}">{{c.num}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: #475569">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1px solid #94A3B8; background: #FFFFFF"></span>Disponible</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #C2410C"></span>Tu elección</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1px dashed #64748B; background: #E2E8F0"></span>Reservado</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #334155"></span>Vendido</span>
    </div>
  </div>

  <footer style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #CBD5E1">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #475569">{{resumen}}</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px">{{total}}</span>
    </div>
    <a href="Pago.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 12px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">Reservar 10 min</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { elegidos: [7, 23] };
  }
  renderVals() {
    const vendidos = [1, 2, 4, 5, 9, 11, 12, 15, 16, 18, 20, 21, 26, 27, 30, 31, 33, 36, 38, 40, 41];
    const reservados = [3, 14, 29, 35];
    const elegidos = this.state.elegidos;
    const base = 'height: 44px; border-radius: 8px; font: 600 13px "JetBrains Mono", monospace; padding: 0;';
    const celdas = [];
    for (let n = 1; n <= 42; n++) {
      const vendido = vendidos.indexOf(n) >= 0;
      const reservado = reservados.indexOf(n) >= 0;
      const elegido = elegidos.indexOf(n) >= 0;
      let estilo = base + ' border: 1px solid #94A3B8; background: #FFFFFF; color: #0F172A; cursor: pointer;';
      let etiqueta = 'Número ' + n + ', disponible';
      if (vendido) {
        estilo = base + ' border: 1px solid #334155; background: #334155; color: #CBD5E1; text-decoration: line-through;';
        etiqueta = 'Número ' + n + ', vendido';
      } else if (reservado) {
        estilo = base + ' border: 1px dashed #64748B; background: #E2E8F0; color: #475569;';
        etiqueta = 'Número ' + n + ', reservado';
      } else if (elegido) {
        estilo = base + ' border: 1px solid #C2410C; background: #C2410C; color: #FFFFFF; cursor: pointer;';
        etiqueta = 'Número ' + n + ', elegido';
      }
      celdas.push({
        num: String(n).padStart(3, '0'),
        estilo: estilo,
        etiqueta: etiqueta,
        elegido: elegido,
        bloqueado: vendido || reservado,
        pick: () => {
          const actual = this.state.elegidos;
          this.setState({ elegidos: actual.indexOf(n) >= 0 ? actual.filter((x) => x !== n) : actual.concat([n]) });
        }
      });
    }
    const cantidad = elegidos.length;
    return {
      celdas: celdas,
      resumen: cantidad === 1 ? '1 número elegido' : cantidad + ' números elegidos',
      total: 'S/ ' + cantidad * 10
    };
  }
}
</script>
</body>
</html>
