<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff8f3">
<title>Verificar registro — Tiendi Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="assets/logo-tiendi-icono.png">
</head>
<body>

<header class="site">
  <div class="container site-inner">
    <a class="brand" href="./" aria-label="Tiendi Shield — inicio">
      <img src="assets/logotipo-tiendi-horizontal.png" alt="Tiendi" width="120" height="30">
      <span class="name">Shield</span>
    </a>
    <nav class="main" aria-label="Navegación principal">
      <a href="./">Aplicaciones</a>
      <a href="panel.html">Mi registro</a>
    </nav>
  </div>
</header>

<main class="container auth-shell">
  <section class="auth-card" aria-labelledby="ver-title">
    <span class="kicker">Verificación</span>
    <h1 id="ver-title">Verificando tu email…</h1>
    <p class="lead" id="state-msg">Estamos confirmando tu registro.</p>
    <div id="alert" class="alert info" hidden role="status"></div>
    <p class="auth-foot"><a href="panel.html" id="panel-link" hidden>Ir a mi panel</a></p>
  </section>
</main>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="verificar.js"></script>
</body>
</html>
