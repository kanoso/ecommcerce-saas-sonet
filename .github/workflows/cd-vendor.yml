name: CD - Deploy Vendor to Staging (Monorepo)

on:
  push:
    branches:
      - master
      - main
      - 'kanoso/*'
    paths:
      - 'FUENTES/tiendi-vendor/**'
      - 'FUENTES/packages/telemetry/**'
      - 'FUENTES/packages/auth-types/**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Entorno de despliegue'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tiendi-vendor

jobs:
  verify:
    name: Verification & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            FUENTES/packages/telemetry/package-lock.json
            FUENTES/tiendi-vendor/package-lock.json

      - name: Build telemetry package
        run: |
          cd FUENTES/packages/telemetry
          npm ci
          npm run build

      - name: Install Vendor dependencies
        run: |
          cd FUENTES/tiendi-vendor
          npm ci

      - name: Lint
        run: |
          cd FUENTES/tiendi-vendor
          npm run lint

      - name: Compile Angular Application
        run: |
          cd FUENTES/tiendi-vendor
          npm run build

      - name: Run Unit Tests
        run: |
          cd FUENTES/tiendi-vendor
          npm test -- --no-watch

  build-and-push:
    name: Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/kanoso/') }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event.inputs.target_env == 'production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: FUENTES
          file: FUENTES/tiendi-vendor/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/kanoso/') || github.event.inputs.target_env == 'staging'

    steps:
      - name: Execute deployment commands on Staging VPS
        uses: appleboy/ssh-action@v1.2.0
        if: ${{ env.STAGING_SSH_HOST != '' }}
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== [1/4] Descargando última imagen Docker de Staging ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

            echo "=== [2/4] Reiniciando contenedor de tiendi-vendor ==="
            # Despliegue del contenedor SPA en el puerto 4201 conectado a frontend_net
            docker stop tiendi-vendor || true
            docker rm tiendi-vendor || true
            docker run -d \
              --name tiendi-vendor \
              --restart always \
              -p 4201:80 \
              --network frontend_net \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

            echo "=== [3/4] Verificando salud del servicio (/health) ==="
            sleep 3
            for i in $(seq 1 10); do
              if curl -s -f -o /dev/null http://localhost:4201/health || curl -s -f -o /dev/null https://vendor.tiendi.pe/health; then
                echo "¡Despliegue de tiendi-vendor a Staging completado exitosamente!"
                exit 0
              fi
              echo "Esperando que el servicio responda (intento $i/10)..."
              sleep 3
            done
            echo "ERROR: tiendi-vendor no superó el health check tras el despliegue."
            exit 1
