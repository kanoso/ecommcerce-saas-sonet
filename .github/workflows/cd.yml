name: CD - Deploy to Staging (Monorepo)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'FUENTES/tiendi-api/**'
      - 'FUENTES/packages/telemetry/**'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Entorno de despliegue'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tiendi-api

jobs:
  verify:
    name: Verification & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: FUENTES/tiendi-api/package-lock.json

      - name: Build telemetry package
        run: |
          cd FUENTES/packages/telemetry
          npm ci
          npm run build

      - name: Install API dependencies
        run: |
          cd FUENTES/tiendi-api
          npm ci

      - name: Generate Prisma Client
        run: |
          cd FUENTES/tiendi-api
          npx prisma generate

      - name: Lint
        run: |
          cd FUENTES/tiendi-api
          npx eslint --quiet "src/**/*.ts"

      - name: Compile TypeScript
        run: |
          cd FUENTES/tiendi-api
          npm run build

      - name: Run Unit Tests
        run: |
          cd FUENTES/tiendi-api
          npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event.inputs.target_env == 'production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: FUENTES
          file: FUENTES/tiendi-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'staging'

    steps:
      - name: Execute deployment commands on Staging VPS
        uses: appleboy/ssh-action@v1.2.0
        if: ${{ env.STAGING_SSH_HOST != '' }}
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== [1/5] Accediendo al directorio de despliegue ==="
            cd /opt/tiendi/FUENTES/tiendi-api || cd /opt/tiendi

            echo "=== [2/5] Descargando última imagen Docker de Staging ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

            echo "=== [3/5] Ejecutando migraciones de base de datos con Prisma ==="
            docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              api npx prisma migrate deploy

            echo "=== [4/5] Reiniciando contenedor de API (Zero Downtime) ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            echo "=== [5/5] Verificando salud del servicio (/health) ==="
            sleep 5
            for i in $(seq 1 10); do
              if curl -s -f -o /dev/null http://localhost:3000/api/v1/health || curl -s -f -o /dev/null https://staging-api.tiendi.pe/health; then
                echo "¡Despliegue a Staging completado exitosamente y servicio saludable!"
                exit 0
              fi
              echo "Esperando que el servicio responda (intento $i/10)..."
              sleep 3
            done
            echo "ERROR: El servicio no superó el health check tras el despliegue."
            exit 1
